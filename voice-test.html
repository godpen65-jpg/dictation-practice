<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목소리 테스트 2</title><style>
body{font-family:"Malgun Gothic",system-ui,sans-serif;background:#eaf6ff;color:#20364a;margin:0;padding:24px 16px}
.w{max-width:580px;margin:0 auto}
h1{font-size:21px;margin:0 0 6px}h2{font-size:17px;margin:26px 0 10px;color:#1e88e5}
p.s{color:#5b7a95;font-size:14px;margin:0 0 8px;line-height:1.6}
.row{background:#fff;border:2px solid #bfe0fb;border-radius:15px;padding:13px 15px;margin-bottom:10px;
display:flex;align-items:center;gap:12px}
.nm{flex:1;font-size:16px;font-weight:800}.dt{display:block;font-size:12px;color:#8aa3b8;font-weight:600;margin-top:3px}
button{border:none;background:linear-gradient(90deg,#ffb24a,#ff9a3d);color:#fff;font-size:15px;font-weight:800;
padding:11px 18px;border-radius:12px;cursor:pointer;box-shadow:0 2px 6px rgba(255,150,60,.3);white-space:nowrap}
button:active{transform:translateY(1px)}
.tip{margin-top:20px;color:#8aa3b8;font-size:13px;line-height:1.7;background:#fff;border-radius:12px;padding:12px 14px}
</style></head><body><div class="w">
<h1>🔊 목소리 테스트 2</h1>
<p class="s">모두 <b>"신나요"</b>를 읽습니다. 또렷하게 <b>"요"</b>로 들리는 게 있으면 번호를 알려 주세요.</p>

<h2>① 억양 바꾸기 (같은 목소리)</h2>
<div id="l1"></div>

<h2>② 이 기기에 있는 한국어 목소리</h2>
<p class="s" id="vinfo">확인 중…</p>
<div id="l2"></div>

<div class="tip">전부 "신나여"로 들리면 → 컴퓨터에 한국어 목소리가 <b>Heami 하나뿐</b>이라 그래요.<br>
윈도우 <b>설정 → 시간 및 언어 → 음성 → 음성 추가</b>에서 한국어(SunHi 등)를 추가하면 목소리가 늘어나요.</div>
</div><script>
let ko=null, voices=[];
function pick(){ voices=speechSynthesis.getVoices();
  const kos=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
  ko=kos[0]||null;
  document.getElementById('vinfo').textContent = kos.length? ('찾은 한국어 목소리 '+kos.length+'개'):'한국어 목소리가 없어요';
  const L=document.getElementById('l2'); L.innerHTML='';
  kos.forEach((v,i)=>L.appendChild(mk((i+1)+'번 · '+v.name, v.name, ()=>say('신나요.',0.9,1,v))));
}
pick(); speechSynthesis.onvoiceschanged=pick;
document.addEventListener('pointerdown',()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}},{once:true});
function say(t,r,p,v){
  const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.voice=v||ko; u.rate=r; u.pitch=p;
  try{speechSynthesis.cancel()}catch(e){} try{speechSynthesis.resume()}catch(e){}
  speechSynthesis.speak(u);
}
function mk(title,desc,fn){
  const row=document.createElement('div'); row.className='row';
  const s=document.createElement('span'); s.className='nm';
  s.innerHTML=title+'<span class="dt">'+desc+'</span>';
  const b=document.createElement('button'); b.textContent='▶ 듣기';
  b.addEventListener('click',fn);
  row.appendChild(s); row.appendChild(b); return row;
}
const T=[
 ["A","신나요,","쉼표 (억양 안 떨어짐)",0.9,1],
 ["B","신나요?","물음표 (끝 올림)",0.9,1],
 ["C","신나요.","음 높게",0.9,1.4],
 ["D","신나요.","음 낮게",0.9,0.7],
 ["E","신나요,","쉼표 + 천천히",0.75,1],
 ["F","신나요?","물음표 + 높게",0.9,1.3]];
const L1=document.getElementById('l1');
T.forEach(([n,t,d,r,p])=>L1.appendChild(mk(n+'번',d,()=>say(t,r,p))));
</script></body></html>
