<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목소리 테스트</title><style>
body{font-family:"Malgun Gothic",system-ui,sans-serif;background:#eaf6ff;color:#20364a;margin:0;padding:24px 16px}
.w{max-width:560px;margin:0 auto}
h1{font-size:21px;margin:0 0 6px}p.s{color:#5b7a95;font-size:14px;margin:0 0 20px;line-height:1.6}
.row{background:#fff;border:2px solid #bfe0fb;border-radius:15px;padding:14px 16px;margin-bottom:11px;
display:flex;align-items:center;gap:12px}
.nm{flex:1;font-size:16px;font-weight:800}.dt{display:block;font-size:12px;color:#8aa3b8;font-weight:600;margin-top:3px}
button{border:none;background:linear-gradient(90deg,#ffb24a,#ff9a3d);color:#fff;font-size:16px;font-weight:800;
padding:12px 20px;border-radius:12px;cursor:pointer;box-shadow:0 2px 6px rgba(255,150,60,.3)}
button:active{transform:translateY(1px)}
.tip{margin-top:18px;color:#8aa3b8;font-size:13px;line-height:1.7}
</style></head><body><div class="w">
<h1>🔊 "신나요" 어떻게 들리나요?</h1>
<p class="s">번호를 눌러 들어보고, <b>가장 또렷하게 "신나요"로 들리는 번호</b>를 알려 주세요.<br>화면을 한 번 톡 누른 뒤 눌러 주세요.</p>
<div id="list"></div>
<p class="tip">지금 쓰는 목소리: <span id="v">확인 중</span></p>
</div><script>
const T=[
 ["1","신나요.","지금 앱과 같음 (마침표 있음)",0.9],
 ["2","신나요","마침표 뺌",0.9],
 ["3","신나요!","느낌표",0.9],
 ["4","신나요.","조금 빠르게",1.05],
 ["5","신나요.","보통 속도",1.0],
 ["6","신 나 요","글자 띄움",0.9],
 ["7","신나요~","물결",0.95]];
let ko=null;
function pick(){const vs=speechSynthesis.getVoices();ko=vs.find(v=>v.lang==='ko-KR')||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'))||null;
 document.getElementById('v').textContent=ko?ko.name:'한국어 목소리 없음';}
pick();speechSynthesis.onvoiceschanged=pick;
document.addEventListener('pointerdown',()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}},{once:true});
function say(t,r){try{speechSynthesis.cancel()}catch(e){}
 setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(ko)u.voice=ko;u.rate=r;u.pitch=1;
 try{speechSynthesis.resume()}catch(e){}speechSynthesis.speak(u)},60);}
document.getElementById('list').innerHTML=T.map(([n,t,d,r])=>
 `<div class="row"><span class="nm">${n}번<span class="dt">${d}</span></span>
  <button onclick="say(${JSON.stringify(t)},${r})">▶ 듣기</button></div>`).join('');
</script></body></html>
